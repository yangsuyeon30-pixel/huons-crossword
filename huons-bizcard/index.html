<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>명함 만들기</title>
<link rel="stylesheet" href="common.css">
<style>
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
header{text-align:center;margin:8px 0 18px}
header h1{font-family:'Jua',sans-serif;color:var(--blue);font-size:32px;margin:0;font-weight:400}
header p{margin:6px 0 0;color:#667;font-size:14px}
.box{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(30,60,100,.07)}
label{display:block;font-family:'Jua',sans-serif;font-size:18px;margin-bottom:8px}
label small{font-family:'Noto Sans KR';color:#999;font-size:12px;font-weight:400}
input[type=text],textarea{width:100%;font-size:16px;font-family:inherit;padding:12px;border:1.5px solid var(--line);border-radius:10px;outline:none;background:#fafcff}
input:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:vertical;min-height:70px}
.name-box{border:2px solid var(--orange)}
.name-row{display:flex;align-items:center;gap:8px}
.name-row .paren{color:var(--orange);font-size:40px;line-height:1}
.name-row input{text-align:center;font-size:20px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.score{display:flex;align-items:center;gap:12px}
.score input[type=range]{flex:1;accent-color:var(--blue);height:28px}
.score b{font-family:'Jua';font-size:28px;color:var(--blue);min-width:72px;text-align:right}
.btn{width:100%;padding:16px;font-size:19px;font-family:'Jua',sans-serif;border:0;border-radius:12px;background:var(--blue);color:#fff}
.btn:disabled{opacity:.5}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue);margin-top:10px}
.err{color:#d33;font-size:14px;margin:8px 0 0;text-align:center;min-height:1em}
#done{display:none;text-align:center}
#done h2{font-family:'Jua';color:var(--blue);font-weight:400;font-size:26px;margin:10px 0}
#done .card-wrap{margin:18px 0;text-align:left}
</style>
</head>
<body>
<div class="wrap">
  <div id="formView">
    <header>
      <h1>명함 만들기</h1>
      <p>질문에 답하면 아래 명함이 바로 채워져요!</p>
    </header>
    <div id="preview" style="margin-bottom:18px"></div>

    <div class="box name-box">
      <label>이름 <small>(관리자가 이름으로 찾아요)</small></label>
      <div class="name-row"><span class="paren">(</span><input type="text" id="name" maxlength="30" placeholder="홍길동" autocomplete="off"><span class="paren">)</span></div>
    </div>

    <div class="box">
      <label>1. 당신의 업무에 대해 간단히 말씀해주세요.</label>
      <textarea id="work" maxlength="300" placeholder="예) 생산관리팀에서 생산 일정을 관리해요"></textarea>
    </div>

    <div class="box">
      <label>2. 당신의 바이오리듬은 몇 점인가요?</label>
      <div class="score"><input type="range" id="bio" min="0" max="100" step="5" value="70"><b id="bioVal">70점</b></div>
      <input type="text" id="bioWhy" maxlength="60" placeholder="한마디 (선택) 예) 커피 마셔서 충전 완료!" style="margin-top:10px">
    </div>

    <div class="box">
      <label>3. 당신에게 가장 소중한 보물은 무엇인가요? <small>(2가지)</small></label>
      <div class="two">
        <input type="text" id="t1" maxlength="40" placeholder="보물 1">
        <input type="text" id="t2" maxlength="40" placeholder="보물 2">
      </div>
    </div>

    <div class="box">
      <label>4. 교육에서 가장 기대하는 점은 무엇인가요?</label>
      <textarea id="expect" maxlength="300" placeholder="예) 동기들과 친해지기"></textarea>
    </div>

    <button class="btn" id="submit">명함 제출하기</button>
    <p class="err" id="err"></p>
  </div>

  <div id="done">
    <h2>명함 완성! 🎉</h2>
    <p style="color:#667;margin:0">제출되었어요. 화면에 내 명함이 나오면 소개해 주세요.</p>
    <div id="myCard"></div>
    <button class="btn ghost" id="again">수정해서 다시 제출하기</button>
  </div>
</div>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
$('bio').oninput = () => $('bioVal').textContent = $('bio').value + '점';

// 작성 중 내용 임시 저장 (새로고침 대비)
const FIELDS = ['name','work','bio','bioWhy','t1','t2','expect'];
try{
  const saved = JSON.parse(localStorage.getItem('bc_draft')||'{}');
  FIELDS.forEach(f=>{ if(saved[f]!=null) $(f).value = saved[f]; });
  $('bioVal').textContent = $('bio').value + '점';
}catch(e){}
function buildRow(){
  const why = $('bioWhy').value.trim();
  return { name:$('name').value.trim(), work:$('work').value.trim(),
    biorhythm:$('bio').value + '점' + (why ? ' – ' + why : ''),
    treasure1:$('t1').value.trim(), treasure2:$('t2').value.trim(), expect:$('expect').value.trim() };
}
function preview(){ $('preview').innerHTML = cardHTML(buildRow()); }
preview();
FIELDS.forEach(f=>$(f).addEventListener('input',preview));
FIELDS.forEach(f=>$(f).addEventListener('input',()=>{
  try{ const o={}; FIELDS.forEach(k=>o[k]=$(k).value); localStorage.setItem('bc_draft',JSON.stringify(o)); }catch(e){}
}));

$('submit').onclick = async () => {
  const name = $('name').value.trim();
  if(!name){ $('err').textContent='이름을 입력해 주세요.'; $('name').focus(); return; }
  const row = buildRow();
  $('submit').disabled = true; $('err').textContent = '';
  try{
    const r = await fetch(SB_URL + '/rest/v1/bc_cards', {method:'POST', headers:{...SB_HEADERS, Prefer:'return=minimal'}, body: JSON.stringify(row)});
    if(!r.ok) throw new Error(await r.text());
    $('myCard').innerHTML = cardHTML(row);
    $('formView').style.display='none'; $('done').style.display='block';
    window.scrollTo(0,0);
  }catch(e){
    $('err').textContent = '제출에 실패했어요. 잠시 후 다시 눌러 주세요.';
  }finally{ $('submit').disabled = false; }
};
$('again').onclick = () => { $('done').style.display='none'; $('formView').style.display='block'; window.scrollTo(0,0); };
</script>
</body>
</html>
